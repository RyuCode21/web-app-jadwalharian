<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Schedule & Task Planner</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Top Navigation Bar -->
    <header class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700/60 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-600/30">
                    <i class="fa-solid fa-calendar-check text-xl text-white"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-white leading-tight">Schedule Planner</h1>
                    <p class="text-xs text-slate-400 hidden sm:block">Kelola Jadwal & Tugas Harian</p>
                </div>
            </div>

            <!-- User Info & Logout -->
            <div class="flex items-center space-x-4">
                <div class="text-right hidden sm:block">
                    <p id="user-email" class="text-xs font-semibold text-slate-200">Loading...</p>
                    <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1.5"></span> Terhubung
                    </span>
                </div>
                <button onclick="handleLogout()" 
                        class="bg-slate-700 hover:bg-rose-600/20 text-slate-300 hover:text-rose-400 border border-slate-600 hover:border-rose-500/30 px-3.5 py-2 rounded-xl text-xs font-semibold transition flex items-center space-x-2">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Keluar</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

        <!-- Banner Statistics & Progress -->
        <section class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-slate-800 border border-slate-700/60 rounded-2xl p-5 flex items-center space-x-4">
                <div class="p-3.5 bg-indigo-500/10 text-indigo-400 rounded-xl border border-indigo-500/20">
                    <i class="fa-solid fa-list-check text-2xl"></i>
                </div>
                <div>
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Total Jadwal</p>
                    <h3 id="stat-total" class="text-2xl font-bold text-white mt-0.5">0</h3>
                </div>
            </div>

            <div class="bg-slate-800 border border-slate-700/60 rounded-2xl p-5 flex items-center space-x-4">
                <div class="p-3.5 bg-emerald-500/10 text-emerald-400 rounded-xl border border-emerald-500/20">
                    <i class="fa-solid fa-circle-check text-2xl"></i>
                </div>
                <div>
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Selesai</p>
                    <h3 id="stat-completed" class="text-2xl font-bold text-white mt-0.5">0</h3>
                </div>
            </div>

            <div class="bg-slate-800 border border-slate-700/60 rounded-2xl p-5 flex items-center space-x-4">
                <div class="p-3.5 bg-amber-500/10 text-amber-400 rounded-xl border border-amber-500/20">
                    <i class="fa-solid fa-clock text-2xl"></i>
                </div>
                <div>
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Belum Selesai</p>
                    <h3 id="stat-pending" class="text-2xl font-bold text-white mt-0.5">0</h3>
                </div>
            </div>

            <!-- Progres Harian Card -->
            <div class="bg-slate-800 border border-slate-700/60 rounded-2xl p-5 flex flex-col justify-center">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-medium text-slate-400 uppercase tracking-wider">Progres Hari Ini</span>
                    <span id="stat-progress-percent" class="text-xs font-bold text-indigo-400">0%</span>
                </div>
                <div class="w-full bg-slate-700 rounded-full h-2.5 overflow-hidden">
                    <div id="stat-progress-bar" class="bg-gradient-to-r from-indigo-500 to-purple-500 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </section>

        <!-- Main Workspace: Calendar & Agenda Section -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">

            <!-- Left Side: Interactive Calendar (5 Cols) -->
            <div class="lg:col-span-5 bg-slate-800 border border-slate-700/60 rounded-2xl p-6 h-fit">
                <div class="flex items-center justify-between mb-6">
                    <h2 id="calendar-month-year" class="font-bold text-lg text-white">Bulan Tahun</h2>
                    <div class="flex space-x-1">
                        <button onclick="changeMonth(-1)" class="p-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-300 transition">
                            <i class="fa-solid fa-chevron-left text-xs"></i>
                        </button>
                        <button onclick="changeMonth(1)" class="p-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-300 transition">
                            <i class="fa-solid fa-chevron-right text-xs"></i>
                        </button>
                    </div>
                </div>

                <!-- Calendar Headers -->
                <div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-slate-400 mb-2">
                    <div>Min</div><div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div>Jum</div><div>Sab</div>
                </div>

                <!-- Days Grid -->
                <div id="calendar-days" class="grid grid-cols-7 gap-1 text-center text-sm"></div>
            </div>

            <!-- Right Side: Agenda & Task List (7 Cols) -->
            <div class="lg:col-span-7 space-y-6">

                <!-- Controls & Filters Bar -->
                <div class="bg-slate-800 border border-slate-700/60 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-4">
                    <div class="flex flex-wrap items-center gap-2 flex-1">
                        <!-- Filter Kategori -->
                        <select id="filter-category" onchange="renderSchedules()" 
                                class="bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:border-indigo-500">
                            <option value="ALL">Semua Kategori</option>
                            <option value="Kerja">Kerja</option>
                            <option value="Pribadi">Pribadi</option>
                            <option value="Belajar">Belajar</option>
                            <option value="Kesehatan">Kesehatan</option>
                            <option value="Umum">Umum</option>
                        </select>

                        <!-- Filter Status -->
                        <select id="filter-status" onchange="renderSchedules()" 
                                class="bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:border-indigo-500">
                            <option value="ALL">Semua Status</option>
                            <option value="PENDING">Belum Selesai</option>
                            <option value="COMPLETED">Selesai</option>
                        </select>
                    </div>

                    <!-- Button Add Task -->
                    <button onclick="openModal()" 
                            class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs px-4 py-2.5 rounded-xl transition shadow-lg shadow-indigo-600/30 flex items-center space-x-2">
                        <i class="fa-solid fa-plus"></i>
                        <span>Tambah Jadwal</span>
                    </button>
                </div>

                <!-- Schedule Item Cards List -->
                <div id="schedule-list" class="space-y-3">
                    <!-- Dynamic Rows Loaded Here -->
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Form (Tambah & Edit Jadwal) -->
    <div id="modal-form" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden">
            <!-- Modal Header -->
            <div class="bg-slate-700/50 px-6 py-4 border-b border-slate-700 flex justify-between items-center">
                <h3 id="modal-title" class="text-base font-bold text-white">Tambah Jadwal Baru</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Modal Form Body -->
            <form id="schedule-form" onsubmit="saveSchedule(event)" class="p-6 space-y-4">
                <input type="hidden" id="form-id">

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Judul Aktivitas</label>
                    <input type="text" id="form-title" required placeholder="Contoh: Rapat Mingguan Tim"
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Tanggal</label>
                        <input type="date" id="form-date" required
                               class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Waktu / Jam</label>
                        <input type="time" id="form-time" required
                               class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Kategori</label>
                        <select id="form-category" required
                                class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-xl px-4 py-2.5 focus:outline-none focus:border-indigo-500">
                            <option value="Kerja">Kerja</option>
                            <option value="Pribadi">Pribadi</option>
                            <option value="Belajar">Belajar</option>
                            <option value="Kesehatan">Kesehatan</option>
                            <option value="Umum">Umum</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Prioritas</label>
                        <select id="form-priority" required
                                class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-xl px-4 py-2.5 focus:outline-none focus:border-indigo-500">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Deskripsi (Opsional)</label>
                    <textarea id="form-description" rows="3" placeholder="Catatan tambahan aktivitas..."
                              class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500"></textarea>
                </div>

                <!-- Footer Buttons -->
                <div class="flex justify-end space-x-3 pt-4 border-t border-slate-700/60">
                    <button type="button" onclick="closeModal()" 
                            class="px-4 py-2.5 rounded-xl border border-slate-700 text-slate-300 text-xs font-semibold hover:bg-slate-700 transition">
                        Batal
                    </button>
                    <button type="submit" id="btn-save" 
                            class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold transition shadow-lg shadow-indigo-600/30 flex items-center space-x-2">
                        <span id="btn-save-text">Simpan Jadwal</span>
                        <i id="btn-save-spinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Application Script -->
    <script>
        // ==========================================
        // KONFIGURASI SUPABASE (Sama dengan index.html)
        // ==========================================
        const SUPABASE_URL = "https://vdczmsqfldfduidoqfyh.supabase.co"; // Ganti dengan Project URL Anda
        const SUPABASE_KEY = "sb_publishable_AztuesOkEMatEixFop8RSQ_yDoszYIV";        // Ganti dengan Publishable/Anon Key Anda

        // Inisialisasi Client Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Application Global States
        let currentUser = null;
        let schedulesData = [];
        let currentDate = new Date();
        let selectedFilterDate = null;

        // Inisialisasi Sesi Login & Muat Data
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session }, error } = await supabase.auth.getSession();

            // Proteksi Halaman: Jika belum login, lempar kembali ke index.html
            if (error || !session) {
                window.location.href = 'index.html';
                return;
            }

            currentUser = session.user;
            document.getElementById('user-email').innerText = currentUser.email;

            // Load Data Pertama Kali
            await fetchSchedules();
            renderCalendar();
        });

        // 1. FETCH DATA DARI SUPABASE DATABASE
        async function fetchSchedules() {
            try {
                const { data, error } = await supabase
                    .from('schedules')
                    .select('*')
                    .order('date', { ascending: true })
                    .order('time', { ascending: true });

                if (error) throw error;

                schedulesData = data || [];
                renderSchedules();
                updateStats();
                renderCalendar();
            } catch (err) {
                console.error("Gagal mengambil data jadwal:", err.message);
                alert("Gagal memuat jadwal: " + err.message);
            }
        }

        // 2. RENDER JADWAL KE TAMPILAN (LIST)
        function renderSchedules() {
            const listContainer = document.getElementById('schedule-list');
            const categoryFilter = document.getElementById('filter-category').value;
            const statusFilter = document.getElementById('filter-status').value;

            // Filter Array Data
            let filtered = schedulesData.filter(item => {
                if (categoryFilter !== 'ALL' && item.category !== categoryFilter) return false;
                if (statusFilter === 'COMPLETED' && !item.is_completed) return false;
                if (statusFilter === 'PENDING' && item.is_completed) return false;
                if (selectedFilterDate && item.date !== selectedFilterDate) return false;
                return true;
            });

            if (filtered.length === 0) {
                listContainer.innerHTML = `
                    <div class="bg-slate-800 border border-slate-700/60 rounded-2xl p-8 text-center">
                        <i class="fa-regular fa-calendar-xmark text-4xl text-slate-600 mb-3"></i>
                        <p class="text-sm font-semibold text-slate-400">Tidak ada jadwal ditemukan</p>
                        <p class="text-xs text-slate-500 mt-1">Coba sesuaikan filter atau tambah jadwal baru.</p>
                    </div>
                `;
                return;
            }

            // Render Item Cards
            listContainer.innerHTML = filtered.map(item => {
                const isDone = item.is_completed;
                const priorityColors = {
                    'High': 'bg-rose-500/10 text-rose-400 border-rose-500/20',
                    'Medium': 'bg-amber-500/10 text-amber-400 border-amber-500/20',
                    'Low': 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20'
                };

                return `
                    <div class="bg-slate-800 border ${isDone ? 'border-slate-700/40 opacity-70' : 'border-slate-700/80'} rounded-2xl p-4 transition flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                        <div class="flex items-start space-x-3.5 flex-1">
                            <!-- Toggle Completed Checkbox -->
                            <button onclick="toggleComplete('${item.id}', ${!isDone})" 
                                    class="mt-1 w-5 h-5 rounded-lg border ${isDone ? 'bg-emerald-500 border-emerald-500 text-slate-900' : 'border-slate-600 hover:border-indigo-500'} flex items-center justify-center transition">
                                ${isDone ? '<i class="fa-solid fa-check text-xs font-bold"></i>' : ''}
                            </button>

                            <div>
                                <div class="flex flex-wrap items-center gap-2">
                                    <h4 class="font-bold text-sm text-white ${isDone ? 'line-through text-slate-400' : ''}">${escapeHtml(item.title)}</h4>
                                    <span class="text-[10px] font-semibold px-2 py-0.5 rounded border ${priorityColors[item.priority]}">${item.priority}</span>
                                    <span class="text-[10px] font-semibold px-2 py-0.5 rounded bg-slate-700 text-slate-300 border border-slate-600">${item.category}</span>
                                </div>
                                ${item.description ? `<p class="text-xs text-slate-400 mt-1">${escapeHtml(item.description)}</p>` : ''}
                                <div class="flex items-center space-x-3 text-[11px] text-slate-400 mt-2">
                                    <span><i class="fa-regular fa-calendar mr-1"></i>${item.date}</span>
                                    <span><i class="fa-regular fa-clock mr-1"></i>${item.time || '--:--'}</span>
                                </div>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex items-center space-x-2 w-full sm:w-auto justify-end border-t sm:border-0 border-slate-700/50 pt-3 sm:pt-0">
                            <button onclick="editSchedule('${item.id}')" class="p-2 text-slate-400 hover:text-indigo-400 transition">
                                <i class="fa-solid fa-pen-to-square text-sm"></i>
                            </button>
                            <button onclick="deleteSchedule('${item.id}')" class="p-2 text-slate-400 hover:text-rose-400 transition">
                                <i class="fa-solid fa-trash-can text-sm"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 3. TAMBAH & EDIT JADWAL (SUPABASE INSERT / UPDATE)
        async function saveSchedule(event) {
            event.preventDefault();
            
            const id = document.getElementById('form-id').value;
            const title = document.getElementById('form-title').value.trim();
            const date = document.getElementById('form-date').value;
            const time = document.getElementById('form-time').value;
            const category = document.getElementById('form-category').value;
            const priority = document.getElementById('form-priority').value;
            const description = document.getElementById('form-description').value.trim();

            setSaveLoading(true);

            try {
                const payload = {
                    user_id: currentUser.id,
                    title,
                    date,
                    time,
                    category,
                    priority,
                    description
                };

                if (id) {
                    // UPDATE
                    const { error } = await supabase
                        .from('schedules')
                        .update(payload)
                        .eq('id', id);
                    if (error) throw error;
                } else {
                    // INSERT
                    const { error } = await supabase
                        .from('schedules')
                        .insert([payload]);
                    if (error) throw error;
                }

                closeModal();
                await fetchSchedules();
            } catch (err) {
                alert("Gagal menyimpan data: " + err.message);
            } finally {
                setSaveLoading(false);
            }
        }

        // 4. TOGGLE STATUS SELESAI / BELUM
        async function toggleComplete(id, isCompleted) {
            try {
                const { error } = await supabase
                    .from('schedules')
                    .update({ is_completed: isCompleted })
                    .eq('id', id);

                if (error) throw error;
                await fetchSchedules();
            } catch (err) {
                alert("Gagal memperbarui status: " + err.message);
            }
        }

        // 5. HAPUS JADWAL
        async function deleteSchedule(id) {
            if (!confirm("Apakah Anda yakin ingin menghapus jadwal ini?")) return;

            try {
                const { error } = await supabase
                    .from('schedules')
                    .delete()
                    .eq('id', id);

                if (error) throw error;
                await fetchSchedules();
            } catch (err) {
                alert("Gagal menghapus jadwal: " + err.message);
            }
        }

        // 6. RENDER KALENDER INTERAKTIF
        function renderCalendar() {
            const monthYearText = document.getElementById('calendar-month-year');
            const daysContainer = document.getElementById('calendar-days');

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            monthYearText.innerText = `${monthNames[month]} ${year}`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            let daysHTML = '';

            // Empty Slots Before Month Start
            for (let i = 0; i < firstDayIndex; i++) {
                daysHTML += `<div class="h-10"></div>`;
            }

            // Month Days
            const todayStr = new Date().toISOString().split('T')[0];

            for (let day = 1; day <= totalDays; day++) {
                const formattedDay = String(day).padStart(2, '0');
                const formattedMonth = String(month + 1).padStart(2, '0');
                const dateStr = `${year}-${formattedMonth}-${formattedDay}`;

                const hasSchedule = schedulesData.some(s => s.date === dateStr);
                const isToday = dateStr === todayStr;
                const isSelected = dateStr === selectedFilterDate;

                daysHTML += `
                    <button onclick="filterByDate('${dateStr}')" 
                            class="h-10 rounded-xl flex flex-col items-center justify-center relative transition
                            ${isSelected ? 'bg-indigo-600 text-white font-bold ring-2 ring-indigo-400' : ''}
                            ${isToday && !isSelected ? 'border border-indigo-500 text-indigo-400 font-bold' : ''}
                            ${!isSelected && !isToday ? 'hover:bg-slate-700/60 text-slate-300' : ''}">
                        <span>${day}</span>
                        ${hasSchedule ? `<span class="w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-white' : 'bg-indigo-400'} mt-0.5"></span>` : ''}
                    </button>
                `;
            }

            daysContainer.innerHTML = daysHTML;
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        }

        function filterByDate(dateStr) {
            if (selectedFilterDate === dateStr) {
                selectedFilterDate = null; // Toggle Off
            } else {
                selectedFilterDate = dateStr;
            }
            renderCalendar();
            renderSchedules();
        }

        // 7. STATISTIK & PROGRES HARIAN
        function updateStats() {
            const total = schedulesData.length;
            const completed = schedulesData.filter(s => s.is_completed).length;
            const pending = total - completed;

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-completed').innerText = completed;
            document.getElementById('stat-pending').innerText = pending;

            // Progres Hari Ini
            const todayStr = new Date().toISOString().split('T')[0];
            const todayTasks = schedulesData.filter(s => s.date === todayStr);
            const todayCompleted = todayTasks.filter(s => s.is_completed).length;

            const percentage = todayTasks.length > 0 ? Math.round((todayCompleted / todayTasks.length) * 100) : 0;
            document.getElementById('stat-progress-percent').innerText = `${percentage}%`;
            document.getElementById('stat-progress-bar').style.width = `${percentage}%`;
        }

        // 8. LOGOUT ACTION
        async function handleLogout() {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        }

        // 9. MODAL HELPERS
        function openModal() {
            document.getElementById('modal-title').innerText = "Tambah Jadwal Baru";
            document.getElementById('schedule-form').reset();
            document.getElementById('form-id').value = "";
            document.getElementById('form-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('modal-form').classList.remove('hidden');
        }

        function editSchedule(id) {
            const item = schedulesData.find(s => s.id === id);
            if (!item) return;

            document.getElementById('modal-title').innerText = "Edit Jadwal";
            document.getElementById('form-id').value = item.id;
            document.getElementById('form-title').value = item.title;
            document.getElementById('form-date').value = item.date;
            document.getElementById('form-time').value = item.time || '';
            document.getElementById('form-category').value = item.category;
            document.getElementById('form-priority').value = item.priority;
            document.getElementById('form-description').value = item.description || '';

            document.getElementById('modal-form').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-form').classList.add('hidden');
        }

        function setSaveLoading(isLoading) {
            const btnSave = document.getElementById('btn-save');
            const btnSpinner = document.getElementById('btn-save-spinner');
            const btnText = document.getElementById('btn-save-text');

            if (isLoading) {
                btnSave.disabled = true;
                btnSpinner.classList.remove('hidden');
                btnText.innerText = "Menyimpan...";
            } else {
                btnSave.disabled = false;
                btnSpinner.classList.add('hidden');
                btnText.innerText = "Simpan Jadwal";
            }
        }

        function escapeHtml(text) {
            return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
        }
    </script>
</body>
</html>
