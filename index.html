<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk & Daftar - Schedule & Todo Planner</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 transition-all">
    
    <!-- Header App -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 bg-indigo-100 text-indigo-600 rounded-xl mb-3">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-800" id="form-title">Masuk ke Akun</h1>
      <p class="text-slate-500 text-sm mt-1" id="form-subtitle">Kelola jadwal dan tugas harian Anda dengan mudah</p>
    </div>

    <!-- Alert Status / Pesan Error/Sukses -->
    <div id="alert-box" class="hidden mb-4 p-3 rounded-lg text-sm font-medium"></div>

    <!-- Form Login & Registrasi -->
    <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
      
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Alamat Email</label>
        <input 
          type="email" 
          id="email" 
          required 
          placeholder="nama@email.com"
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-slate-800 text-sm"
        >
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Kata Sandi</label>
        <input 
          type="password" 
          id="password" 
          required 
          minlength="6"
          placeholder="••••••••"
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-slate-800 text-sm"
        >
      </div>

      <button 
        type="submit" 
        id="btn-submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2"
      >
        <span>Masuk</span>
      </button>

    </form>

    <!-- Toggle Antara Login & Daftar -->
    <div class="mt-6 text-center text-sm text-slate-600">
      <span id="toggle-text">Belum punya akun?</span>
      <button 
        type="button" 
        onclick="toggleMode()" 
        id="toggle-btn" 
        class="text-indigo-600 font-semibold hover:underline ml-1"
      >
        Daftar Sekarang
      </button>
    </div>

    <!-- Pengaturan Kredensial Supabase -->
    <div class="mt-8 pt-6 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
      <span id="config-status" class="flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-red-500" id="status-indicator"></span>
        <span id="status-text">Supabase belum dikonfigurasi</span>
      </span>
      <button 
        type="button" 
        onclick="openConfigModal()" 
        class="text-indigo-600 hover:underline font-medium"
      >
        Atur API Supabase
      </button>
    </div>

  </div>

  <!-- Modal Konfigurasi Supabase URL & Key -->
  <div id="config-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <h3 class="text-lg font-bold text-slate-800 mb-2">Konfigurasi Supabase</h3>
      <p class="text-xs text-slate-500 mb-4">Masukkan Supabase URL dan Anon Key project Anda. Data ini disimpan lokal di browser Anda.</p>
      
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Supabase URL</label>
          <input 
            type="text" 
            id="supabase-url" 
            placeholder="https://xyzcompany.supabase.co" 
            class="w-full px-3 py-2 border rounded-lg text-xs outline-none focus:ring-2 focus:ring-indigo-500"
          >
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">Supabase Anon Key</label>
          <input 
            type="password" 
            id="supabase-key" 
            placeholder="eyJhbGciOiJIUzI1NiIsInR5..." 
            class="w-full px-3 py-2 border rounded-lg text-xs outline-none focus:ring-2 focus:ring-indigo-500"
          >
        </div>
      </div>

      <div class="mt-5 flex justify-end gap-2">
        <button 
          type="button" 
          onclick="closeConfigModal()" 
          class="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-lg"
        >
          Batal
        </button>
        <button 
          type="button" 
          onclick="saveConfig()" 
          class="px-4 py-2 text-xs font-medium bg-indigo-600 text-white rounded-lg hover:bg-indigo-700"
        >
          Simpan Konfigurasi
        </button>
      </div>
    </div>
  </div>

  <script>
    // Variable State
    let isLoginMode = true;
    let supabaseClient = null;

    // Inisialisasi awal saat halaman dimuat
    document.addEventListener("DOMContentLoaded", () => {
      initSupabase();
      checkExistingSession();
    });

    // Inisialisasi Supabase Client
    function initSupabase() {
      const url = localStorage.getItem("SUPABASE_URL");
      const key = localStorage.getItem("SUPABASE_ANON_KEY");

      const indicator = document.getElementById("status-indicator");
      const statusText = document.getElementById("status-text");

      if (url && key) {
        try {
          supabaseClient = window.supabase.createClient(url, key);
          indicator.className = "w-2 h-2 rounded-full bg-emerald-500";
          statusText.innerText = "Terhubung ke Supabase";
        } catch (e) {
          indicator.className = "w-2 h-2 rounded-full bg-red-500";
          statusText.innerText = "Kredensial tidak valid";
          supabaseClient = null;
        }
      } else {
        indicator.className = "w-2 h-2 rounded-full bg-red-500";
        statusText.innerText = "Supabase belum dikonfigurasi";
        supabaseClient = null;
      }
    }

    // Cek Sesi Pengguna (Jika sudah login, otomatis pindah ke dashboard.html)
    async function checkExistingSession() {
      if (!supabaseClient) return;

      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        window.location.href = "dashboard.html";
      }
    }

    // Toggle Antara Form Login & Form Registrasi
    function toggleMode() {
      isLoginMode = !isLoginMode;
      const title = document.getElementById("form-title");
      const subtitle = document.getElementById("form-subtitle");
      const btnSubmit = document.getElementById("btn-submit");
      const toggleText = document.getElementById("toggle-text");
      const toggleBtn = document.getElementById("toggle-btn");

      hideAlert();

      if (isLoginMode) {
        title.innerText = "Masuk ke Akun";
        subtitle.innerText = "Kelola jadwal dan tugas harian Anda dengan mudah";
        btnSubmit.innerHTML = "<span>Masuk</span>";
        toggleText.innerText = "Belum punya akun?";
        toggleBtn.innerText = "Daftar Sekarang";
      } else {
        title.innerText = "Buat Akun Baru";
        subtitle.innerText = "Daftarkan email Anda untuk mulai mencatat jadwal";
        btnSubmit.innerHTML = "<span>Daftar Akun</span>";
        toggleText.innerText = "Sudah punya akun?";
        toggleBtn.innerText = "Masuk di sini";
      }
    }

    // Eksekusi Auth (Login / Register)
    async function handleAuth(event) {
      event.preventDefault();

      if (!supabaseClient) {
        showAlert("Harap atur URL dan Anon Key Supabase terlebih dahulu melalui tombol di bawah.", "error");
        openConfigModal();
        return;
      }

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const btnSubmit = document.getElementById("btn-submit");

      // Set Loading state
      btnSubmit.disabled = true;
      btnSubmit.classList.add("opacity-70");
      btnSubmit.innerHTML = `<span>Proses...</span>`;

      try {
        if (isLoginMode) {
          // --- PROSES LOGIN ---
          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

          if (error) throw error;

          showAlert("Login berhasil! Mengalihkan ke dashboard...", "success");
          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 1000);

        } else {
          // --- PROSES REGISTRASI ---
          const { data, error } = await supabaseClient.auth.signUp({
            email: email,
            password: password
          });

          if (error) throw error;

          // Cek jika butuh konfirmasi email
          if (data.user && data.session === null) {
            showAlert("Registrasi berhasil! Silakan periksa kotak masuk email Anda untuk melakukan verifikasi akun.", "success");
          } else {
            showAlert("Registrasi berhasil! Mengalihkan...", "success");
            setTimeout(() => {
              window.location.href = "dashboard.html";
            }, 1000);
          }
        }
      } catch (err) {
        showAlert(err.message || "Terjadi kesalahan. Coba lagi.", "error");
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.classList.remove("opacity-70");
        btnSubmit.innerHTML = isLoginMode ? "<span>Masuk</span>" : "<span>Daftar Akun</span>";
      }
    }

    // Helper Fungsi Tampilkan Alert
    function showAlert(message, type = "error") {
      const alertBox = document.getElementById("alert-box");
      alertBox.innerText = message;
      alertBox.classList.remove("hidden", "bg-red-100", "text-red-700", "bg-emerald-100", "text-emerald-700");

      if (type === "error") {
        alertBox.classList.add("bg-red-100", "text-red-700");
      } else {
        alertBox.classList.add("bg-emerald-100", "text-emerald-700");
      }
    }

    function hideAlert() {
      const alertBox = document.getElementById("alert-box");
      alertBox.classList.add("hidden");
    }

    // Fungsi Modal Konfigurasi API Supabase
    function openConfigModal() {
      document.getElementById("supabase-url").value = localStorage.getItem("SUPABASE_URL") || "";
      document.getElementById("supabase-key").value = localStorage.getItem("SUPABASE_ANON_KEY") || "";
      document.getElementById("config-modal").classList.remove("hidden");
    }

    function closeConfigModal() {
      document.getElementById("config-modal").classList.add("hidden");
    }

    function saveConfig() {
      const url = document.getElementById("supabase-url").value.trim();
      const key = document.getElementById("supabase-key").value.trim();

      if (!url || !key) {
        alert("Harap isi Supabase URL dan Anon Key!");
        return;
      }

      localStorage.setItem("SUPABASE_URL", url);
      localStorage.setItem("SUPABASE_ANON_KEY", key);

      closeConfigModal();
      initSupabase();
      showAlert("Konfigurasi Supabase berhasil disimpan!", "success");
    }
  </script>
</body>
</html>
