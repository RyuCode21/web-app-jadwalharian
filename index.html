<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk & Daftar - Schedule App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden">
        <!-- Header / Logo -->
        <div class="bg-gradient-to-r from-indigo-600 to-purple-600 p-6 text-center">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-white/10 rounded-2xl mb-3 backdrop-blur-sm">
                <i class="fa-solid fa-calendar-check text-2xl text-white"></i>
            </div>
            <h1 class="text-2xl font-bold text-white">Schedule Planner</h1>
            <p class="text-indigo-200 text-sm mt-1">Kelola jadwal dan tugas harian Anda</p>
        </div>

        <!-- Form Container -->
        <div class="p-6 sm:p-8">
            <!-- Tab Switcher -->
            <div class="flex bg-slate-900/60 p-1 rounded-xl mb-6 border border-slate-700/50">
                <button id="tab-login" onclick="switchTab('login')" 
                        class="flex-1 py-2 text-sm font-semibold rounded-lg transition-all duration-200 bg-indigo-600 text-white shadow-md">
                    Masuk
                </button>
                <button id="tab-register" onclick="switchTab('register')" 
                        class="flex-1 py-2 text-sm font-semibold rounded-lg transition-all duration-200 text-slate-400 hover:text-white">
                    Daftar
                </button>
            </div>

            <!-- Alert Message Box -->
            <div id="alert-box" class="hidden mb-4 p-3.5 rounded-xl text-sm flex items-start space-x-2 transition-all">
                <i id="alert-icon" class="fa-solid text-base mt-0.5"></i>
                <div id="alert-text" class="flex-1"></div>
            </div>

            <!-- Form Auth -->
            <form id="auth-form" onsubmit="handleSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Email</label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500"></i>
                        <input type="email" id="email" required placeholder="nama@email.com" 
                               class="w-full bg-slate-900 border border-slate-700 rounded-xl py-2.5 pl-10 pr-4 text-white text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Kata Sandi</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500"></i>
                        <input type="password" id="password" required placeholder="••••••••" minlength="6"
                               class="w-full bg-slate-900 border border-slate-700 rounded-xl py-2.5 pl-10 pr-4 text-white text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                    </div>
                </div>

                <button type="submit" id="btn-submit" 
                        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition duration-200 shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-2 mt-6">
                    <span id="btn-text">Masuk Ke Akun</span>
                    <i id="btn-spinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
                </button>
            </form>
        </div>
    </div>

    <script>
        // ==========================================
        // KONFIGURASI SUPABASE
        // ==========================================
        const SUPABASE_URL = "https://vdczmsqfldfduidoqfyh.supabase.co";
        const SUPABASE_KEY = "sb_publishable_AztuesOkEMatEixFop8RSQ_yDoszYIV";

        // Inisialisasi Supabase Client
        let supabase = null;
        if (window.supabase && SUPABASE_URL && SUPABASE_KEY) {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        let currentMode = 'login'; // 'login' atau 'register'

        // Periksa Sesi Login Saat Halaman Dimuat
        document.addEventListener('DOMContentLoaded', async () => {
            if (!supabase) {
                showAlert('Gagal menghubungkan ke Supabase. Periksa pustaka CDN dan kredensial Anda.', 'error');
                return;
            }

            try {
                const { data: { session }, error } = await supabase.auth.getSession();
                if (error) throw error;

                if (session) {
                    // Jika pengguna sudah login, alihkan otomatis ke dashboard
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {
                console.error("Gagal memeriksa sesi login:", err.message);
            }
        });

        // Pindah Tab Login / Register
        function switchTab(mode) {
            currentMode = mode;
            hideAlert();
            
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const btnText = document.getElementById('btn-text');

            if (mode === 'login') {
                tabLogin.className = "flex-1 py-2 text-sm font-semibold rounded-lg transition-all duration-200 bg-indigo-600 text-white shadow-md";
                tabRegister.className = "flex-1 py-2 text-sm font-semibold rounded-lg transition-all duration-200 text-slate-400 hover:text-white";
                btnText.innerText = "Masuk Ke Akun";
            } else {
                tabRegister.className = "flex-1 py-2 text-sm font-semibold rounded-lg transition-all duration-200 bg-indigo-600 text-white shadow-md";
                tabLogin.className = "flex-1 py-2 text-sm font-semibold rounded-lg transition-all duration-200 text-slate-400 hover:text-white";
                btnText.innerText = "Daftar Akun Baru";
            }
        }

        // Handle Submit Form Login & Register
        async function handleSubmit(event) {
            event.preventDefault();

            if (!supabase) {
                showAlert('Koneksi ke Supabase belum siap.', 'error');
                return;
            }

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            setLoading(true);
            hideAlert();

            try {
                if (currentMode === 'login') {
                    // Proses Autentikasi Login
                    const { data, error } = await supabase.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                    if (error) throw error;

                    showAlert('Berhasil masuk! Pengalihan ke dashboard...', 'success');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 800);

                } else {
                    // Proses Registrasi Pengguna Baru
                    const { data, error } = await supabase.auth.signUp({
                        email: email,
                        password: password
                    });

                    if (error) throw error;

                    // Jika opsi Konfirmasi Email aktif di Supabase Dashboard
                    if (data?.user && data?.session === null) {
                        showAlert('Pendaftaran berhasil! Silakan periksa inbox/spam email Anda untuk verifikasi akun.', 'info');
                    } else {
                        showAlert('Pendaftaran berhasil! Mengalihkan ke dashboard...', 'success');
                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 1000);
                    }
                }
            } catch (err) {
                let errorMsg = err.message || 'Terjadi kesalahan pada proses autentikasi';
                if (err.message.includes('Invalid login credentials')) {
                    errorMsg = 'Email atau kata sandi tidak valid.';
                } else if (err.message.includes('User already registered')) {
                    errorMsg = 'Email ini sudah terdaftar. Silakan lakukan Login.';
                }
                showAlert(errorMsg, 'error');
            } finally {
                setLoading(false);
            }
        }

        // Helper Alert Notification UI
        function showAlert(message, type) {
            const alertBox = document.getElementById('alert-box');
            const alertText = document.getElementById('alert-text');
            const alertIcon = document.getElementById('alert-icon');

            alertText.innerText = message;
            alertBox.classList.remove('hidden', 'bg-red-500/10', 'text-red-400', 'border-red-500/20', 
                                     'bg-emerald-500/10', 'text-emerald-400', 'border-emerald-500/20', 
                                     'bg-amber-500/10', 'text-amber-400', 'border-amber-500/20');

            if (type === 'error') {
                alertBox.classList.add('bg-red-500/10', 'text-red-400', 'border', 'border-red-500/20');
                alertIcon.className = 'fa-solid fa-triangle-exclamation text-base mt-0.5 text-red-400';
            } else if (type === 'success') {
                alertBox.classList.add('bg-emerald-500/10', 'text-emerald-400', 'border', 'border-emerald-500/20');
                alertIcon.className = 'fa-solid fa-circle-check text-base mt-0.5 text-emerald-400';
            } else {
                alertBox.classList.add('bg-amber-500/10', 'text-amber-400', 'border', 'border-amber-500/20');
                alertIcon.className = 'fa-solid fa-circle-info text-base mt-0.5 text-amber-400';
            }
        }

        function hideAlert() {
            document.getElementById('alert-box').classList.add('hidden');
        }

        // Helper Loading Spinner State
        function setLoading(isLoading) {
            const btnSubmit = document.getElementById('btn-submit');
            const btnSpinner = document.getElementById('btn-spinner');

            if (isLoading) {
                btnSubmit.disabled = true;
                btnSubmit.classList.add('opacity-75', 'cursor-not-allowed');
                btnSpinner.classList.remove('hidden');
            } else {
                btnSubmit.disabled = false;
                btnSubmit.classList.remove('opacity-75', 'cursor-not-allowed');
                btnSpinner.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
