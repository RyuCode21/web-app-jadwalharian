<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Jadwal Harian</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; max-width: 800px; margin: auto; padding: 20px; }
    .hidden { display: none; }
    .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    .schedule-item { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eee; padding: 10px 0; }
    .completed { text-decoration: line-through; color: gray; }
    .progress-bar { background: #eee; border-radius: 5px; height: 15px; width: 100%; overflow: hidden; margin: 10px 0; }
    .progress-fill { background: #4CAF50; height: 100%; width: 0%; transition: width 0.3s; }
  </style>
</head>
<body>

  <!-- AUTH SECTION -->
  <div id="auth-section" class="card">
    <h2>Login / Registrasi</h2>
    <input type="email" id="auth-email" placeholder="Email" required>
    <input type="password" id="auth-password" placeholder="Password" required>
    <br><br>
    <button onclick="login()">Login</button>
    <button onclick="signUp()">Registrasi</button>
  </div>

  <!-- DASHBOARD SECTION -->
  <div id="dashboard-section" class="card hidden">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2>Dashboard Jadwal</h2>
      <button onclick="logout()">Logout</button>
    </div>

    <!-- FORM TAMBAH JADWAL -->
    <div>
      <h3>Tambah Jadwal Baru</h3>
      <input type="text" id="sched-title" placeholder="Nama Aktivitas" required>
      <select id="sched-category">
        <option value="Umum">Umum</option>
        <option value="Pekerjaan">Pekerjaan</option>
        <option value="Pribadi">Pribadi</option>
        <option value="Belajar">Belajar</option>
      </select>
      <input type="date" id="sched-date" required>
      <input type="time" id="sched-time">
      <button onclick="addSchedule()">Tambah</button>
    </div>

    <hr>

    <!-- PROGRES HARI INI -->
    <div>
      <h3>Progres Aktivitas Hari Ini</h3>
      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <p id="progress-text">0% Selesai</p>
    </div>

    <hr>

    <!-- FILTER & KALENDER -->
    <div>
      <h3>Daftar Jadwal</h3>
      <label>Filter Tanggal: </label>
      <input type="date" id="filter-date" onchange="loadSchedules()">
      
      <label>Kategori: </label>
      <select id="filter-category" onchange="loadSchedules()">
        <option value="ALL">Semua Kategori</option>
        <option value="Umum">Umum</option>
        <option value="Pekerjaan">Pekerjaan</option>
        <option value="Pribadi">Pribadi</option>
        <option value="Belajar">Belajar</option>
      </select>
    </div>

    <div id="schedule-list"></div>
  </div>

  <script>
    // Inisialisasi Supabase
    const SUPABASE_URL = 'https://jyvmhwdmrioscgypprzo.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_xfam8X8Pwf2VR7vVg0Wmjw_y1MMjsgW';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Initial State Check
    window.onload = async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        showDashboard();
      }
      
      // Default filter tanggal ke hari ini
      document.getElementById('filter-date').valueAsDate = new Date();
      document.getElementById('sched-date').valueAsDate = new Date();
    };

    // AUTHENTICATION FUNCTIONS
    async function signUp() {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) alert(error.message);
      else alert('Registrasi berhasil! Silakan periksa email Anda jika konfirmasi diaktifkan.');
    }

    async function login() {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) alert(error.message);
      else showDashboard();
    }

    async function logout() {
      await supabase.auth.signOut();
      document.getElementById('auth-section').classList.remove('hidden');
      document.getElementById('dashboard-section').classList.add('hidden');
    }

    function showDashboard() {
      document.getElementById('auth-section').classList.add('hidden');
      document.getElementById('dashboard-section').classList.remove('hidden');
      loadSchedules();
    }

    // CRUD FUNCTIONS
    async function addSchedule() {
      const { data: { user } } = await supabase.auth.getUser();
      const title = document.getElementById('sched-title').value;
      const category = document.getElementById('sched-category').value;
      const date = document.getElementById('sched-date').value;
      const time = document.getElementById('sched-time').value;

      if (!title || !date) return alert('Judul dan tanggal wajib diisi');

      const { error } = await supabase.from('schedules').insert([{
        user_id: user.id,
        title,
        category,
        date,
        time: time || null
      }]);

      if (error) alert(error.message);
      else {
        document.getElementById('sched-title').value = '';
        loadSchedules();
      }
    }

    async function loadSchedules() {
      const filterDate = document.getElementById('filter-date').value;
      const filterCategory = document.getElementById('filter-category').value;

      let query = supabase.from('schedules').select('*');

      if (filterDate) query = query.eq('date', filterDate);
      if (filterCategory !== 'ALL') query = query.eq('category', filterCategory);

      const { data, error } = await query.order('time', { ascending: true });

      if (error) {
        alert(error.message);
        return;
      }

      renderSchedules(data);
      updateProgress(data);
    }

    async function toggleComplete(id, currentStatus) {
      const { error } = await supabase
        .from('schedules')
        .update({ is_completed: !currentStatus })
        .eq('id', id);

      if (error) alert(error.message);
      else loadSchedules();
    }

    async function deleteSchedule(id) {
      if (!confirm('Yakin ingin menghapus jadwal ini?')) return;

      const { error } = await supabase.from('schedules').eq('id', id).delete();

      if (error) alert(error.message);
      else loadSchedules();
    }

    async function editSchedule(id, oldTitle) {
      const newTitle = prompt('Edit judul aktivitas:', oldTitle);
      if (!newTitle) return;

      const { error } = await supabase
        .from('schedules')
        .update({ title: newTitle })
        .eq('id', id);

      if (error) alert(error.message);
      else loadSchedules();
    }

    // RENDER FUNCTIONS
    function renderSchedules(schedules) {
      const container = document.getElementById('schedule-list');
      container.innerHTML = '';

      if (schedules.length === 0) {
        container.innerHTML = '<p>Tidak ada jadwal.</p>';
        return;
      }

      schedules.forEach(item => {
        const div = document.createElement('div');
        div.className = 'schedule-item';
        div.innerHTML = `
          <div>
            <input type="checkbox" ${item.is_completed ? 'checked' : ''} onchange="toggleComplete('${item.id}', ${item.is_completed})">
            <span class="${item.is_completed ? 'completed' : ''}">
              <strong>[${item.category}]</strong> ${item.title} (${item.time || 'Tanpa Jam'})
            </span>
          </div>
          <div>
            <button onclick="editSchedule('${item.id}', '${item.title}')">Edit</button>
            <button onclick="deleteSchedule('${item.id}')">Hapus</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function updateProgress(schedules) {
      if (schedules.length === 0) {
        document.getElementById('progress-fill').style.width = '0%';
        document.getElementById('progress-text').innerText = '0% Selesai';
        return;
      }

      const completedCount = schedules.filter(s => s.is_completed).length;
      const percentage = Math.round((completedCount / schedules.length) * 100);

      document.getElementById('progress-fill').style.width = `${percentage}%`;
      document.getElementById('progress-text').innerText = `${percentage}% Selesai (${completedCount}/${schedules.length})`;
    }
  </script>
</body>
</html>
